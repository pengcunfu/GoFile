<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>局域网文件传输助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 24px;
            color: #333333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 12px 2px rgba(0, 0, 0, 0.09);
            overflow: hidden;
        }

        .header {
            background: #ffffff;
            color: #333333;
            padding: 24px 32px;
            border-bottom: 1px solid #efeff5;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #333333;
        }

        .header p {
            font-size: 14px;
            color: #666666;
        }

        .upload-section {
            padding: 32px;
            background: #ffffff;
            border-bottom: 1px solid #efeff5;
        }

        .upload-area {
            border: 2px dashed #e4e7ed;
            border-radius: 8px;
            padding: 48px 32px;
            text-align: center;
            background: #ffffff;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .upload-area:hover {
            background: #e1f5e8;
            border-color: #18a058;
        }

        .upload-area.dragover {
            background: #e1f5e8;
            border-color: #18a058;
            box-shadow: 0 0 0 2px #e1f5e8;
        }

        .upload-area h3 {
            font-size: 16px;
            font-weight: 500;
            color: #333333;
            margin-bottom: 8px;
        }

        .upload-area p {
            font-size: 14px;
            color: #666666;
            margin-bottom: 20px;
        }

        .upload-btn {
            background: #18a058;
            color: white;
            border: none;
            padding: 9px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .upload-btn:hover {
            background: #36ad6a;
        }

        .upload-btn:active {
            background: #0c7a46;
        }

        .upload-btn:disabled {
            background: #e4e7ed;
            color: #666666;
            cursor: not-allowed;
        }

        #fileInput {
            display: none;
        }

        .progress-container {
            margin-top: 16px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e4e7ed;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #18a058;
            width: 0%;
            transition: width 0.3s ease;
        }

        .files-section {
            padding: 32px;
        }

        .files-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .files-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #333333;
        }

        .refresh-btn {
            background: #ffffff;
            color: #333333;
            border: 1px solid #e4e7ed;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .refresh-btn:hover {
            background: #e1f5e8;
            border-color: #18a058;
            color: #18a058;
        }

        .file-list {
            display: block;
        }

        .file-item {
            background: #ffffff;
            border: 1px solid #e4e7ed;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .file-item:hover {
            border-color: #18a058;
            box-shadow: 0 2px 8px 2px rgba(0, 0, 0, 0.08);
        }

        .file-info {
            flex: 1;
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .file-details {
            display: block;
            min-width: 0;
            flex: 1;
        }

        .file-name {
            font-weight: 500;
            color: #333333;
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-meta {
            font-size: 13px;
            color: #666666;
            margin-top: 4px;
        }

        .file-actions {
            display: flex;
            flex-shrink: 0;
        }

        .btn {
            padding: 8px 14px;
            border: 1px solid #e4e7ed;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: #ffffff;
            color: #333333;
            display: inline-block;
            margin-left: 8px;
        }

        .btn:first-child {
            margin-left: 0;
        }

        .download-btn {
            color: #18a058;
            border-color: #18a058;
        }

        .download-btn:hover {
            background: #18a058;
            color: white;
        }

        .delete-btn {
            color: #d03050;
            border-color: #d03050;
        }

        .delete-btn:hover {
            background: #d03050;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666666;
        }

        .empty-state h3 {
            font-size: 16px;
            font-weight: 500;
            color: #4d4d4d;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: #666666;
        }

        .notification {
            position: fixed;
            top: 24px;
            right: 24px;
            background: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 8px 16px 4px rgba(0, 0, 0, 0.1);
            display: none;
            z-index: 1000;
            font-size: 14px;
            border-left: 3px solid #18a058;
        }

        .notification.error {
            border-left-color: #d03050;
        }

        @media screen and (max-width: 768px) {
            body {
                padding: 16px;
            }

            .upload-section,
            .files-section {
                padding: 20px;
            }

            .file-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .file-info {
                width: 100%;
                margin-bottom: 16px;
            }

            .file-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .header {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>局域网文件传输助手</h1>
            <p>快速、安全的文件传输解决方案</p>
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <h3>点击或拖拽文件到此处上传</h3>
                <p>支持任意文件类型</p>
                <button class="upload-btn" id="uploadBtn">
                    <span>选择文件</span>
                </button>
                <input type="file" id="fileInput" multiple>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <div class="files-section">
            <div class="files-header">
                <h2>文件列表</h2>
                <button class="refresh-btn" id="refreshBtn">
                    <span>刷新</span>
                </button>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        var uploadArea = document.getElementById('uploadArea');
        var uploadBtn = document.getElementById('uploadBtn');
        var fileInput = document.getElementById('fileInput');
        var progressContainer = document.getElementById('progressContainer');
        var progressFill = document.getElementById('progressFill');
        var fileList = document.getElementById('fileList');
        var refreshBtn = document.getElementById('refreshBtn');
        var notification = document.getElementById('notification');

        // 显示通知
        function showNotification(message, type) {
            type = type || 'success';
            notification.textContent = message;
            notification.className = 'notification ' + type;
            notification.style.display = 'block';
            setTimeout(function() {
                notification.style.display = 'none';
            }, 3000);
        }

        // 格式化文件大小
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            var k = 1024;
            var sizes = ['B', 'KB', 'MB', 'GB'];
            var i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // 加载文件列表
        function loadFiles() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/files', true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var files = JSON.parse(xhr.responseText);

                    if (files.length === 0) {
                        fileList.innerHTML =
                            '<div class="empty-state">' +
                                '<h3>暂无文件</h3>' +
                                '<p>上传您的第一个文件开始使用</p>' +
                            '</div>';
                        return;
                    }

                    var html = files.map(function(file) {
                        return (
                            '<div class="file-item">' +
                                '<div class="file-info">' +
                                    '<div class="file-details">' +
                                        '<div class="file-name" title="' + file.name + '">' + file.name + '</div>' +
                                        '<div class="file-meta">' + formatSize(file.size) + ' · ' + new Date(file.modified * 1000).toLocaleString('zh-CN') + '</div>' +
                                    '</div>' +
                                '</div>' +
                                '<div class="file-actions">' +
                                    '<button class="btn download-btn" onclick="downloadFile(\'' + file.name + '\')">' +
                                        '<span>下载</span>' +
                                    '</button>' +
                                    '<button class="btn delete-btn" onclick="deleteFile(\'' + file.name + '\')">' +
                                        '<span>删除</span>' +
                                    '</button>' +
                                '</div>' +
                            '</div>'
                        );
                    }).join('');
                    fileList.innerHTML = html;
                } else {
                    showNotification('加载文件列表失败', 'error');
                }
            };
            xhr.onerror = function() {
                showNotification('加载文件列表失败', 'error');
            };
            xhr.send();
        }

        // 上传文件
        function uploadFile(file) {
            var formData = new FormData();
            formData.append('file', file);

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload', true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    showNotification('文件 "' + file.name + '" 上传成功');
                    loadFiles();
                } else {
                    showNotification('文件上传失败', 'error');
                }
            };
            xhr.onerror = function() {
                showNotification('上传失败', 'error');
            };
            xhr.send(formData);
        }

        // 下载文件
        function downloadFile(filename) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/download/' + encodeURIComponent(filename), true);
            xhr.responseType = 'blob';
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var blob = xhr.response;
                    var url = window.URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    showNotification('下载开始');
                } else {
                    showNotification('下载失败', 'error');
                }
            };
            xhr.onerror = function() {
                showNotification('下载失败', 'error');
            };
            xhr.send();
        }

        // 删除文件
        function deleteFile(filename) {
            if (!confirm('确定要删除文件 "' + filename + '" 吗？')) {
                return;
            }

            var xhr = new XMLHttpRequest();
            xhr.open('DELETE', '/api/delete/' + encodeURIComponent(filename), true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    showNotification('文件 "' + filename + '" 已删除');
                    loadFiles();
                } else {
                    showNotification('删除失败', 'error');
                }
            };
            xhr.onerror = function() {
                showNotification('删除失败', 'error');
            };
            xhr.send();
        }

        // 文件选择
        uploadBtn.addEventListener('click', function() {
            fileInput.click();
        });

        fileInput.addEventListener('change', function(e) {
            var files = e.target.files;
            for (var i = 0; i < files.length; i++) {
                uploadFile(files[i]);
            }
            fileInput.value = '';
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadArea.className = 'upload-area dragover';
        });

        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            uploadArea.className = 'upload-area';
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadArea.className = 'upload-area';
            var files = e.dataTransfer.files;
            for (var i = 0; i < files.length; i++) {
                uploadFile(files[i]);
            }
        });

        // 刷新按钮
        refreshBtn.addEventListener('click', loadFiles);

        // 初始加载
        loadFiles();
    </script>
</body>
</html>
